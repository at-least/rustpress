# rustpress's own documentation site (dogfood). The page tree mirrors
# vitepress.dev's, rewritten for what rustpress actually implements.
#
#   cargo run -- build docs      # → docs/public
#   cargo run -- serve docs      # live-reloading dev server

title = "rustpress"
description = "A standalone documentation site generator in Rust that speaks VitePress's content format."
lang = "en"
base = "/"
lastUpdated = true
logo = "logo.svg"

[editLink]
pattern = "https://github.com/at-least/rustpress/edit/main/docs/content/:path"
text = "Edit this page on GitHub"

[footer]
message = "Released under the MIT License."
copyright = "Copyright © 2026-present newlix"

[outline]
level = [2, 3]
label = "On this page"

[search]
provider = "local"

[markdown]
math = true

[sitemap]
# Origin only: page URLs already carry `base`. For the GitHub Pages project
# site set `base = "/rustpress/"` (the dev server does not serve under a base yet).
hostname = "https://at-least.github.io"

[[head]]
tag = "link"
attrs = { rel = "icon", type = "image/svg+xml", href = "/logo.svg" }

# Live bundled-theme demo (/themes/): applies a session-picked
# theme before first paint. Tiny, local, no-op without a demo choice.
[[head]]
tag = "script"
attrs = { src = "/js/theme-demo.js" }

# Live syntax-highlight demo (/syntax-highlight/): same pattern,
# no-op without its gallery host.
[[head]]
tag = "script"
attrs = { src = "/js/syntax-demo.js" }

[[nav]]
text = "Guide"
link = "/guide/what-is-rustpress/"
activeMatch = "/guide/"

[[nav]]
text = "Themes"
link = "/themes/"
activeMatch = "/themes/"

[[nav]]
text = "Reference"
link = "/reference/site-config/"
activeMatch = "/reference/"

[[nav]]
text = "0.1.0"
items = [
  { text = "Changelog", link = "https://github.com/at-least/rustpress/commits/main" },
  { text = "Feature parity with VitePress", link = "https://github.com/at-least/rustpress/blob/main/FEATURE-PARITY.md" },
]

[[socialLinks]]
icon = "github"
link = "https://github.com/at-least/rustpress"

