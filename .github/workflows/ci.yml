name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the upstream gates (verbatim corpora, feature-parity audit) need
      # the pinned vuejs/vitepress clone — fail loudly, never skip
      - name: Sync the pinned upstream clone
        run: bash scripts/sync-upstream.sh
      - run: npm ci
      - run: npm test
