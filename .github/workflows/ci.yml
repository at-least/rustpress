name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # headless Chromium for the viewport-parity gate (check:viewport);
      # the package's install script fetches it into ~/.cache/ms-playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the upstream gates (verbatim corpora, feature-parity audit) need
      # the pinned vuejs/vitepress clone — fail loudly, never skip
      - name: Sync the pinned upstream clone
        run: bash scripts/sync-upstream.sh
      - run: npm ci
      # system libs headless Chromium needs on ubuntu runners
      - run: npx playwright install-deps chromium
      - run: npm test
