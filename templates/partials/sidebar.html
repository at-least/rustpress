{% if sidebar_root and has_sidebar %}
{% set root_title = sidebar_root.extra.vitepress_sidebar_title | default(value="") %}
{# VPSidebar — mobile drawer; `.open` toggled by static/js/app.js #}
<aside class="VPSidebar fixed top-[var(--vp-layout-top-height,0px)] bottom-0 left-0 z-(--vp-z-index-sidebar) px-8 pt-8 pb-24 w-[calc(100vw-4rem)] max-w-80 bg-(--vp-sidebar-bg-color) opacity-0 shadow-3 max-lg:dark:shadow-(--vp-shadow-1) overflow-x-hidden overflow-y-auto overscroll-contain -translate-x-full [transition:opacity_0.5s,transform_0.25s_ease] max-lg:[&.open]:opacity-100 max-lg:[&.open]:visible max-lg:[&.open]:translate-x-0 max-lg:[&.open]:[transition:opacity_0.25s,transform_0.5s_cubic-bezier(0.19,1,0.22,1)] lg:pt-(--vp-nav-height) lg:w-(--vp-sidebar-width) lg:max-w-full lg:opacity-100 lg:visible lg:shadow-none lg:translate-x-0 2xl:pl-[max(2rem,calc((100%-(var(--vp-layout-max-width)-4rem))/2))] 2xl:w-[calc((100%-(var(--vp-layout-max-width)-4rem))/2+var(--vp-sidebar-width)-2rem)]" id="VPSidebar">
  <div class="lg:sticky lg:top-[calc(var(--vp-nav-height)*-1)] lg:left-0 lg:z-[1] lg:-mt-(--vp-nav-height) lg:-mr-8 lg:-ml-8 lg:h-(--vp-nav-height) lg:bg-(--vp-sidebar-bg-color)"></div>

  <nav class="outline-0" id="VPSidebarNav" aria-labelledby="sidebar-aria-label" tabindex="-1">
    <span class="sr-only" id="sidebar-aria-label">Sidebar Navigation</span>

    {{ <sidebar_items section={sidebar_root} current_permalink={current_permalink} depth={0} lang={lang} root_title={root_title} wrap={true} /> }}
  </nav>
</aside>
{% endif %}
