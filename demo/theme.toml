# UI palette overrides — the color-only part of VitePress's
# "extending the default theme". Every entry overrides one root-level
# CSS custom property; keys without the leading `--` get the `--vp-`
# prefix. Source-code syntax colors are NOT set here — they are the
# separate [markdown.theme] setting in gen-docs.toml.
#
# Examples (uncomment to apply):
#
# [light]
# c-brand-1 = "#508d3f"
# c-brand-2 = "#629a4e"
# c-brand-3 = "#83aa63"
# c-brand-soft = "rgba(131, 170, 99, 0.16)"
# nav-bg-color = "#f6f6f6"
# "--vp-font-family-base" = "\"Inter\", sans-serif"
#
# [dark]
# c-brand-1 = "#83aa63"
