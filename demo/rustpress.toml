# Demo site configuration, mirroring the vitepress.dev docs corpus in
# content/ (a near-verbatim copy of vitepress/docs/en — VitePress's own
# content format).

title = "VitePress"
description = "Vite & Vue powered static site generator."
lang = "en"
base = "/"
lastUpdated = true
logo = "vitepress-logo-mini.svg"
theme = "theme.css"

[editLink]
pattern = "https://github.com/vuejs/vitepress/edit/main/docs/en/:path"
text = "Edit this page on GitHub"

[footer]
message = "Released under the MIT License."
copyright = "Copyright © 2019-present Evan You"

[outline]
# vitepress.dev sets no outline in docs/config.ts, so the deployed site
# runs the theme default: H2 only. Pages wanting deeper outlines opt in
# per page with `outline: deep` front matter (markdown, routing, deploy,
# cms, ssr-compat, extending-default-theme).
level = [2]
label = "On this page"

[search]
provider = "local"

[[nav]]
text = "Guide"
link = "/guide/what-is-vitepress/"
activeMatch = "/guide/"

[[nav]]
text = "Reference"
link = "/reference/site-config/"
activeMatch = "/reference/"

[[nav]]
text = "2.0.0-alpha.20"
items = [
  { text = "1.6.4", link = "https://vuejs.github.io/vitepress/v1/" },
  { text = "Changelog", link = "https://github.com/vuejs/vitepress/blob/main/CHANGELOG.md" },
  { text = "Contributing", link = "https://github.com/vuejs/vitepress/blob/main/.github/contributing.md" },
]

[[socialLinks]]
icon = "github"
link = "https://github.com/vuejs/vitepress"

