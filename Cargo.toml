[package]
name = "rustpress-cli"
version = "0.1.0"
edition = "2024"
description = "Standalone VitePress-format docs site generator in Rust"
license = "MIT"
repository = "https://github.com/at-least/rustpress"
readme = "README.md"
keywords = ["vitepress", "documentation", "static-site", "markdown", "docs"]
categories = ["command-line-utilities", "web-programming", "text-processing"]
# The crate name is `rustpress-cli` because `rustpress` on crates.io belongs to
# another project; the library and the installed binary are still `rustpress`.
# Only the sources plus the compile-time embedded assets/ (syntax themes) and
# static/ (built theme CSS/JS, fonts) go to crates.io; `include` also brings in
# the gitignored static/vitepress.css and static/js/app.js.
default-run = "rustpress"
include = [
    "/src",
    "/assets",
    "/static",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "rustpress"
path = "src/lib.rs"

[[bin]]
name = "rustpress"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }
futures-core = "0.3"
hypertext = { version = "0.12.1", features = ["alpine"] }
include_dir = "0.7"
notify = "8"
regex = "1"
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
toml = "0.9"
tower = { version = "0.5", default-features = false, features = ["util"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.26"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[dev-dependencies]
